name: Publish fixed animation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out public animation
        uses: actions/checkout@v6
        with:
          sparse-checkout: designs/dual-tube-design/animation
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload finished presentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: designs/dual-tube-design/animation
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
